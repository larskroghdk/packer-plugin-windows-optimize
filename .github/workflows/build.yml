name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Lint, test and build
    runs-on: windows-2025
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-packer@v3
      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          install: make tar zip unzip
          path-type: inherit
      - name: Install PowerShell test tools
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          $modules = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "WindowsPowerShell\Modules"
          $null = New-Item -ItemType Directory -Force -Path $modules
          Save-Module Pester -RequiredVersion 6.2.0 -Path $modules -Force
      - name: Check, test and build
        run: |
          msys2 -c 'set -euo pipefail; make init; make generate-check; make check; make release-snapshot'
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            dist/
            !dist/*/*
